        value: "true"
      - key: SMTP_USER
        value: tectomarksupport@gmail.com
      - key: SMTP_PASS
        value: pzzcylzqlwtzxtnl
      - key: EMAIL_FROM
        value: "Tecto Mark <tectomarksupport@gmail.com>"
