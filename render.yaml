services:
  - type: web
    name: tectomark
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        value: tectomarksupport@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
